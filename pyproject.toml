[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "limit_memory(limit): memory-growth limit enforced by pytest-memray when the test extra is installed",
]

[tool.ruff]
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
