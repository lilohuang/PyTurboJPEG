name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux-test:
    name: Test (Py ${{ matrix.python-version }}, turbo ${{ matrix.libjpeg-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        libjpeg-version: ['3.0.0', '3.1.0', '3.1.3']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake nasm
    
    - name: Download and install libjpeg-turbo ${{ matrix.libjpeg-version }}
      run: |
        cd /tmp
        wget -q https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${{ matrix.libjpeg-version }}/libjpeg-turbo-${{ matrix.libjpeg-version }}.tar.gz
        tar -xzf libjpeg-turbo-${{ matrix.libjpeg-version }}.tar.gz
        cd libjpeg-turbo-${{ matrix.libjpeg-version }}
        mkdir build
        cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e '.[test]'
    
    - name: Run test suite
      run: |
        pytest tests/ -v

  cross-platform-test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.13']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install libjpeg-turbo (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install jpeg-turbo
        echo "TURBOJPEG_LIB_PATH=$(brew --prefix jpeg-turbo)/lib/libturbojpeg.dylib" >> "$GITHUB_ENV"

    - name: Install libjpeg-turbo (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest `
          https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.3/libjpeg-turbo-3.1.3-vc64.exe `
          -OutFile "$env:RUNNER_TEMP\libjpeg-turbo.exe"
        Start-Process `
          -FilePath "$env:RUNNER_TEMP\libjpeg-turbo.exe" `
          -ArgumentList '/S' -Wait
        "TURBOJPEG_LIB_PATH=C:\libjpeg-turbo64\bin\turbojpeg.dll" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Run test suite
      run: pytest tests/ -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: python -m pip install ruff==0.12.0
    - run: ruff check turbojpeg.py tests/

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Build distributions
      run: |
        python -m pip install --upgrade build twine
        python -m build
        python -m twine check dist/*
    - name: Install wheel and import module
      run: |
        python -m pip install --force-reinstall dist/*.whl
        python -c "import turbojpeg; print(turbojpeg.__version__)"
