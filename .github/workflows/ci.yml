name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux-test:
    name: Test (Py ${{ matrix.python-version }}, turbo ${{ matrix.libjpeg-version }}, NumPy ${{ matrix.numpy-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        libjpeg-version: ['3.0.0', '3.1.0', '3.1.3', '3.2.0']
        numpy-version: ['latest']
        include:
          - python-version: '3.13'
            libjpeg-version: '3.2.0'
            numpy-version: 'latest'
            coverage: true
          - python-version: '3.12'
            libjpeg-version: '3.2.0'
            numpy-version: '1.26.4'
          - python-version: '3.12'
            libjpeg-version: '3.2.0'
            numpy-version: '2.*'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake nasm
    
    - name: Download and install libjpeg-turbo ${{ matrix.libjpeg-version }}
      run: |
        cd /tmp
        wget -q https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${{ matrix.libjpeg-version }}/libjpeg-turbo-${{ matrix.libjpeg-version }}.tar.gz
        tar -xzf libjpeg-turbo-${{ matrix.libjpeg-version }}.tar.gz
        cd libjpeg-turbo-${{ matrix.libjpeg-version }}
        mkdir build
        cd build
        cmake -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig
    
    - name: Install Python dependencies
      env:
        NUMPY_VERSION: ${{ matrix.numpy-version }}
      run: |
        python -m pip install --upgrade pip
        if [ "$NUMPY_VERSION" = latest ]; then
          python -m pip install -e '.[test]'
        else
          python -m pip install -e '.[test]' "numpy==$NUMPY_VERSION"
        fi
        python -c "import numpy; print('NumPy', numpy.__version__)"
    
    - name: Run test suite
      if: ${{ !matrix.coverage }}
      run: |
        pytest tests/ -v

    - name: Run test suite with branch coverage
      if: matrix.coverage
      run: |
        pytest tests/ -v --cov=turbojpeg --cov-branch \
          --cov-report=term-missing --cov-report=xml:coverage.xml \
          --cov-report=html:htmlcov

    - name: Upload coverage report
      if: ${{ !cancelled() && matrix.coverage }}
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: |
          coverage.xml
          htmlcov/
        retention-days: 14

  cross-platform-test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }}, turbo ${{ matrix.libjpeg-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: '3.13'
            libjpeg-version: 'homebrew'
          - os: macos-latest
            python-version: '3.14'
            libjpeg-version: 'homebrew'
          - os: windows-latest
            python-version: '3.13'
            libjpeg-version: '3.1.3'
          - os: windows-latest
            python-version: '3.14'
            libjpeg-version: '3.2.0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install libjpeg-turbo (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install jpeg-turbo
        echo "TURBOJPEG_LIB_PATH=$(brew --prefix jpeg-turbo)/lib/libturbojpeg.dylib" >> "$GITHUB_ENV"

    - name: Install libjpeg-turbo (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Invoke-WebRequest `
          https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${{ matrix.libjpeg-version }}/libjpeg-turbo-${{ matrix.libjpeg-version }}-vc-x64.exe `
          -OutFile "$env:RUNNER_TEMP\libjpeg-turbo.exe"
        Start-Process `
          -FilePath "$env:RUNNER_TEMP\libjpeg-turbo.exe" `
          -ArgumentList '/S' -Wait
        "TURBOJPEG_LIB_PATH=C:\libjpeg-turbo64\bin\turbojpeg.dll" |
          Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Run test suite
      run: pytest tests/ -v

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - run: python -m pip install ruff==0.12.0
    - run: ruff check turbojpeg.py tests/

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TURBOJPEG_LIB_PATH: /opt/libjpeg-turbo/lib64/libturbojpeg.so
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Build distributions
      run: |
        python -m pip install --upgrade build twine
        python -m build
        python -m twine check dist/*
    - name: Install libjpeg-turbo for package tests
      run: |
        wget -q https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.2.0/libjpeg-turbo-official_3.2.0_amd64.deb \
          -O "$RUNNER_TEMP/libjpeg-turbo.deb"
        sudo dpkg -i "$RUNNER_TEMP/libjpeg-turbo.deb"
    - name: Install wheel in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/wheel-test"
        "$RUNNER_TEMP/wheel-test/bin/python" -m pip install dist/*.whl
    - name: Test installed wheel
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/wheel-test/bin/python" -I - <<'PY'
        import os
        import sys
        from importlib.metadata import version
        from pathlib import Path

        import numpy as np
        import turbojpeg
        from turbojpeg import TurboJPEG, TJCS_DEFAULT, TJCS_RGB, TJPF_RGB, TJSAMP_444

        module_path = Path(turbojpeg.__file__).resolve()
        assert module_path.is_relative_to(Path(sys.prefix).resolve()), module_path
        assert turbojpeg.__version__ == version('PyTurboJPEG')

        jpeg = TurboJPEG(os.environ['TURBOJPEG_LIB_PATH'])
        image = np.arange(17 * 19 * 3, dtype=np.uint8).reshape(17, 19, 3)
        encoded = jpeg.encode(image, pixel_format=TJPF_RGB,
                              jpeg_subsample=TJSAMP_444, jpeg_colorspace=TJCS_RGB)
        assert jpeg.decode_header(encoded) == (19, 17, TJSAMP_444, TJCS_RGB)
        decoded = jpeg.decode(encoded, pixel_format=TJPF_RGB)
        assert decoded.shape == image.shape and decoded.dtype == image.dtype

        lossless = jpeg.encode(image, pixel_format=TJPF_RGB, lossless=True,
                               jpeg_colorspace=TJCS_DEFAULT)
        np.testing.assert_array_equal(jpeg.decode(lossless, pixel_format=TJPF_RGB), image)
        print(f'Installed PyTurboJPEG {turbojpeg.__version__}: {module_path}')
        PY

    - name: Run tests from the source distribution
      run: |
        python -m venv "$RUNNER_TEMP/sdist-test"
        python - <<'PY'
        import os
        import tarfile
        from pathlib import Path

        archive, = Path('dist').glob('*.tar.gz')
        destination = Path(os.environ['RUNNER_TEMP']) / 'sdist-source'
        with tarfile.open(archive) as source:
            source.extractall(destination, filter='data')
        root, = destination.iterdir()
        for name in ('conftest.py', 'crop_test_data.py', 'test_crop_input.jpg'):
            assert (root / 'tests' / name).is_file(), name
        PY
        cd "$RUNNER_TEMP"/sdist-source/*
        "$RUNNER_TEMP/sdist-test/bin/python" -m pip install '.[test]'
        "$RUNNER_TEMP/sdist-test/bin/python" -m pytest tests/ -q
